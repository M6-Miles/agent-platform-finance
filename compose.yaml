services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11.9-slim-bookworm}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        APT_MIRROR_HOST: ${APT_MIRROR_HOST:-mirrors.aliyun.com}
    container_name: agent-platform-demo
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:8003:8003"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 3g
    cpus: 2.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/ready', timeout=5).read()"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 45s
