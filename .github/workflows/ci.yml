name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LLM_PROVIDER: mock
      MARKET_DATA_PROVIDER: sample
      DEEPSEEK_API_KEY: ""
      ANTHROPIC_API_KEY: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,akshare,llm]"

      - name: Static checks
        run: |
          python -m pyflakes src Scripts tests
          python -m compileall -q src Scripts tests

      - name: Offline tests
        run: python -m pytest -q -m "not online" -p no:cacheprovider
